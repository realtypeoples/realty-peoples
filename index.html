<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Realty Peoples — Back Soon</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1a1a1a;--muted:#6b6b6b;--accent:#b08d57;--line:#e7e2d9;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',sans-serif;background:#fff;color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px}
  .wrap{max-width:560px}
  .brand{font-family:'Cormorant Garamond',serif;font-size:clamp(34px,6vw,52px);font-weight:600}
  .label{margin-top:20px;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}
  h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(26px,4vw,38px);margin-top:14px}
  p{color:var(--muted);margin-top:18px;font-size:16px;line-height:1.7}
  .rule{width:60px;height:1px;background:var(--line);margin:32px auto}
  a{color:var(--accent);text-decoration:none}
  .contact{font-size:14px;color:var(--muted);line-height:2}
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">Realty Peoples</div>
    <div class="label">Orange County · LA County · Southern California</div>
    <h1>We'll be back soon.</h1>
    <p>Our site is briefly down for maintenance. Thank you for your patience — we'll be right back.</p>
    <div class="rule"></div>
    <div class="contact">In the meantime, reach us directly:<br>
      <a href="tel:7147700777">714.770.0777</a> · <a href="mailto:info@realtypeoples.com">info@realtypeoples.com</a>
    </div>
  </div>
</body>
</html>
